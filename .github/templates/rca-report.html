<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RCA Report</title>
  <style>
    :root {
      --bg: #f8f9fb;
      --card: #fff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #3b82f6;
      --pass: #059669;
      --warn: #d97706;
      --fail: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      padding: 2rem 1rem 3rem;
      font-size: 15px;
    }

    .wrap { max-width: 720px; margin: 0 auto; }

    header {
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.25rem;
    }

    header p { color: var(--muted); font-size: 0.9rem; }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem 1.5rem;
      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .summary {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
    }

    .summary strong {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }

    .case {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 1.25rem;
      overflow: hidden;
    }

    .case-head {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    .case-head h2 {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.35;
      margin-bottom: 0.35rem;
    }

    .case-meta {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .case-meta code {
      font-size: 0.78rem;
      background: #f3f4f6;
      padding: 0.1rem 0.35rem;
      border-radius: 4px;
    }

    .facts {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.8rem;
    }

    .facts div {
      padding: 0.65rem 1rem;
      border-right: 1px solid var(--border);
    }

    .facts div:last-child { border-right: none; }

    .facts label {
      display: block;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 0.15rem;
    }

    .facts span { font-weight: 500; }

    .case-body { padding: 1rem 1.25rem 1.15rem; }

    .blurb {
      font-size: 0.95rem;
      margin-bottom: 1rem;
      padding: 0.75rem 0.9rem;
      background: #f9fafb;
      border-radius: 6px;
      border-left: 3px solid var(--accent);
    }

    .block { margin-bottom: 0.85rem; }
    .block:last-child { margin-bottom: 0; }

    .block h3 {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 0.3rem;
    }

    .block p { font-size: 0.9rem; color: var(--text); }
    .block ul { margin-left: 1.1rem; font-size: 0.9rem; color: var(--text); }

    details { margin-top: 0.5rem; font-size: 0.85rem; }

    details summary {
      cursor: pointer;
      color: var(--accent);
      user-select: none;
    }

    pre {
      margin-top: 0.5rem;
      padding: 0.75rem;
      background: #f9fafb;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: Consolas, monospace;
      font-size: 0.78rem;
      white-space: pre-wrap;
      word-break: break-word;
      color: #374151;
      max-height: 12rem;
      overflow-y: auto;
    }

    .status-pass { color: var(--pass); }
    .status-warn { color: var(--warn); }
    .status-fail { color: var(--fail); }

    .footer {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
    }

    @media (max-width: 520px) {
      .facts { grid-template-columns: 1fr; }
      .facts div { border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Investigation report</h1>
      <p>Playwright test failures</p>
      <div class="meta">
        <span>Generated <time datetime="{{GENERATED_ISO}}">{{GENERATED_ISO}}</time></span>
        <span>{{FAILURE_COUNT}} failure(s) investigated</span>
        <span>{{OVERALL_STATUS}}</span>
      </div>
    </header>

    <div class="summary">
      <strong>Summary</strong>
      <p>{{SUMMARY}}</p>
    </div>

    {{CASES}}

    <div class="summary">
      <strong>Validation</strong>
      <p>{{VALIDATION}}</p>
    </div>

    <p class="footer">TestPilot AI</p>
  </div>
  <script>
    for (const el of document.querySelectorAll('time[datetime]')) {
      const value = el.getAttribute('datetime');
      if (!value) continue;
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) continue;
      el.textContent = date.toLocaleString(undefined, {
        dateStyle: 'medium',
        timeStyle: 'medium',
      });
    }
  </script>
</body>
</html>
